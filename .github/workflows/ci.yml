name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer_cc: [gcc, clang]
    env:
      HONK_SANITIZER_CC: ${{ matrix.sanitizer_cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # UTC benchmark compares the immutable pre-integration commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsodium-dev pkg-config
      - run: make setup
      - run: make check test security
      - run: make sanitize portable
      - run: make bench
      - run: make diagnostics-bench-smoke
      - run: make parallel-bench-smoke PARALLEL_BENCH_OUTPUT=.build/parallel-benchmark-smoke.json
